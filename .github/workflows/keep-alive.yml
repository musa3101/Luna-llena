name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 cada martes y viernes (dos veces por semana)
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$URL" ]; then
            URL="https://qjqhsjaydknvntohmmnz.supabase.co"
          fi
          if [ -z "$KEY" ]; then
            KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqcWhzamF5ZGtudm50b2htbW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDM4NDQsImV4cCI6MjEwNjYxOTg0NH0.ZxznNBdEieNy8IjJtt1CQFFlhQynorQaG_4q7MaI0ew"
          fi
          echo "Pinging Supabase at $URL..."
          curl --fail -s -X GET "$URL/auth/v1/health" \
            -H "apikey: $KEY" > /dev/null
          echo "Ping successful!"
